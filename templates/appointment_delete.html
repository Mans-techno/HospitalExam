<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отмена записи</title>
</head>
<body>
    <h1>Отмена записи</h1>
    <p>Вы точно хотите отменить запись на {{ appointment.date|date:'d.m.Y' }} {{ appointment.time|time:'H:i' }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Отменить запись</button>
    </form>

    <p><a href="{% url 'appointment_list' %}">Назад</a></p>
</body>
</html>
