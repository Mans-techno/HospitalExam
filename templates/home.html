<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись к врачу</title>
</head>
<body>
    <h1>Запись к врачу — Душанбе</h1>

    <p><a href="{% url 'specialty_list' %}">Записаться к врачу</a></p>

    {% if user.is_authenticated %}
        <p>Привет, {{ user.email }}</p>
        <a href="{% url 'appointment_list' %}">Мои записи</a>
        {% if user.doctor %}
            <a href="{% url 'doctor_appointments' %}">Кабинет врача</a>
        {% endif %}
        <a href="{% url 'logout' %}">Выйти</a>
    {% else %}
        <a href="{% url 'login' %}">Войти</a>
        <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</body>
</html>
