{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}">✚ МедЗапись</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'specialty_list' %}">Врачи</a>
                <a href="{% url 'appointment_list' %}">Мои записи</a>
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <h1>Вход</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>Email: <input type="email" name="email" required></p>
        <p>Пароль: <input type="password" name="password" required></p>
        <button type="submit">Войти</button>
    </form>

    <p><a href="{% url 'register' %}">Регистрация</a></p>
    <footer>© 2026 МедЗапись — онлайн запись к врачу в Душанбе</footer>
</body>
</html>
