<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Города</title>
</head>
<body>
    <h1>Города</h1>
    <p><a href="{% url 'manage_city_create' %}">Добавить город</a></p>

    <ul>
        {% for city in cities %}
            <li>
                {{ city.name }}
                <a href="{% url 'manage_city_update' city.pk %}">Изменить</a>
                <a href="{% url 'manage_city_delete' city.pk %}">Удалить</a>
            </li>
        {% empty %}
            <li>Городов пока нет</li>
        {% endfor %}
    </ul>

    <p><a href="{% url 'home' %}">На главную</a></p>
</body>
</html>
