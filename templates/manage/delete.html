<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление</title>
</head>
<body>
    <h1>Удаление</h1>
    <p>Вы точно хотите удалить «{{ item }}»?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>

    <p><a href="{% url back %}">Назад</a></p>
</body>
</html>
