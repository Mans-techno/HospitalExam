{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}">✚ МедЗапись</a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'specialty_list' %}">Врачи</a>
                <a href="{% url 'appointment_list' %}">Мои записи</a>
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <h1>Удаление</h1>
    <p>Вы точно хотите удалить «{{ item }}»?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>

    <p><a href="{% url back %}">Назад</a></p>
    <footer>© 2026 МедЗапись — онлайн запись к врачу в Душанбе</footer>
</body>
</html>
