<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специальности</title>
</head>
<body>
    <h1>Выберите специальность</h1>

    <p><a href="{% url 'home' %}">На главную</a></p>
</body>
</html>
